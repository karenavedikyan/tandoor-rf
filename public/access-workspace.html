<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Замещения — tandoor-rf</title>
    <link rel="stylesheet" href="/fonts/exo-2/fonts.css" />
    <link rel="stylesheet" href="/brand/legacy-shell.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/clients.css" />
  </head>
  <body class="legacy-body">
    <div class="legacy-app">
      <div id="workspace-sidebar"></div>
      <button type="button" class="legacy-backdrop" id="legacy-backdrop" hidden aria-label="Закрыть меню"></button>
      <div class="legacy-frame">
        <div id="workspace-topbar"></div>
        <main class="legacy-content">
          <header class="clients-page-header">
            <h1 class="clients-page-title">Замещения и доступ</h1>
            <p class="clients-subtitle" id="access-workspace-subtitle">Управление замещениями в пределах вашей области.</p>
          </header>

          <div id="access-panel" class="clients-panel" hidden></div>

          <div id="access-workspace-app" class="clients-panel clients-hidden">
            <section id="section-manager" class="clients-card clients-hidden" data-role-section="manager">
              <h2 class="clients-card__title">Создать замещение</h2>
              <form id="manager-delegation-form" class="clients-filters">
                <label class="field">
                  <span class="field__label">Ассистент (поиск по имени)</span>
                  <input id="manager-assistant-search" class="field__input" type="search" placeholder="Фамилия или email" />
                </label>
                <button type="button" class="workspace-button workspace-button--secondary" id="manager-assistant-search-btn">Найти ассистента</button>
                <div id="manager-assistant-results" class="clients-table-wrap"></div>
                <input type="hidden" id="manager-assistant-id" />
                <div id="manager-client-picker" class="clients-table-wrap"></div>
                <label class="field">
                  <span class="field__label">Начало (<span data-msk-label>Москва, МСК</span>)</span>
                  <input id="manager-starts" class="field__input" type="datetime-local" required />
                </label>
                <label class="field">
                  <span class="field__label">Окончание (<span data-msk-label>Москва, МСК</span>, не включая)</span>
                  <input id="manager-ends" class="field__input" type="datetime-local" required />
                </label>
                <label class="field"><span class="field__label">Основание</span><input id="manager-basis" class="field__input" required /></label>
                <button type="submit" class="workspace-button workspace-button--primary">Отправить на согласование</button>
              </form>
            </section>

            <section id="section-coordinator" class="clients-card clients-hidden" data-role-section="coordinator">
              <h2 class="clients-card__title">Создать замещение (команда)</h2>
              <form id="coordinator-delegation-form" class="clients-filters">
                <label class="field">
                  <span class="field__label">Менеджер (из назначенных команд)</span>
                  <select id="coordinator-delegator" class="field__input" required></select>
                </label>
                <label class="field">
                  <span class="field__label">Ассистент (поиск)</span>
                  <input id="coordinator-assistant-search" class="field__input" type="search" placeholder="Фамилия или email" />
                </label>
                <button type="button" class="workspace-button workspace-button--secondary" id="coordinator-assistant-search-btn">Найти ассистента</button>
                <div id="coordinator-assistant-results" class="clients-table-wrap"></div>
                <input type="hidden" id="coordinator-assistant-id" />
                <div id="coordinator-client-picker" class="clients-table-wrap"></div>
                <label class="field">
                  <span class="field__label">Начало (<span data-msk-label>Москва, МСК</span>)</span>
                  <input id="coordinator-starts" class="field__input" type="datetime-local" required />
                </label>
                <label class="field">
                  <span class="field__label">Окончание (<span data-msk-label>Москва, МСК</span>, не включая)</span>
                  <input id="coordinator-ends" class="field__input" type="datetime-local" required />
                </label>
                <label class="field"><span class="field__label">Основание</span><input id="coordinator-basis" class="field__input" required /></label>
                <button type="submit" class="workspace-button workspace-button--primary">Отправить на согласование</button>
              </form>
            </section>

            <section id="section-delegations-list" class="clients-card">
              <h2 class="clients-card__title">Список замещений</h2>
              <div id="delegations-table" class="clients-table-wrap"></div>
            </section>

            <section id="section-delegation-detail" class="clients-card clients-hidden">
              <h2 class="clients-card__title">Состав замещения</h2>
              <div id="delegation-detail-body" class="clients-table-wrap"></div>
              <div id="delegation-detail-actions" class="clients-filters"></div>
              <form id="delegation-change-form" class="clients-filters clients-hidden">
                <h3 class="clients-card__title">Запрос изменения</h3>
                <div id="change-client-picker" class="clients-table-wrap"></div>
                <label class="field">
                  <span class="field__label">Начало (<span data-msk-label>Москва, МСК</span>)</span>
                  <input id="change-starts" class="field__input" type="datetime-local" required />
                </label>
                <label class="field">
                  <span class="field__label">Окончание (<span data-msk-label>Москва, МСК</span>, не включая)</span>
                  <input id="change-ends" class="field__input" type="datetime-local" required />
                </label>
                <label class="field"><span class="field__label">Основание</span><input id="change-basis" class="field__input" required /></label>
                <button type="submit" class="workspace-button workspace-button--primary">Отправить изменение на согласование</button>
              </form>
            </section>

            <section id="section-rop-team" class="clients-card clients-hidden" data-role-section="rop">
              <h2 class="clients-card__title">Команда РОП</h2>
              <div id="rop-team-table" class="clients-table-wrap"></div>
            </section>

            <section id="section-coordinator-teams" class="clients-card clients-hidden" data-role-section="coordinator">
              <h2 class="clients-card__title">Назначенные команды</h2>
              <div id="coordinator-teams-table" class="clients-table-wrap"></div>
            </section>

            <section id="section-explain" class="clients-card clients-hidden" data-role-section="manager,rop,director">
              <h2 class="clients-card__title">Диагностика доступа</h2>
              <form id="explain-self-form" class="clients-filters">
                <label class="field">
                  <span class="field__label">Клиент из вашей области</span>
                  <select id="explain-client-select" class="field__input" required></select>
                </label>
                <button type="submit" class="workspace-button workspace-button--secondary">Проверить мой доступ</button>
              </form>
              <div id="explain-self-result" class="clients-table-wrap"></div>
            </section>

            <p id="access-workspace-status" class="status" role="status" aria-live="polite"></p>
          </div>
        </main>
      </div>
    </div>
    <script src="/common.js" defer></script>
    <script src="/brand/shell-icons.js" defer></script>
    <script src="/clients-shell.js" defer></script>
    <script src="/access-datetime.js" defer></script>
    <script src="/access-workspace.js" defer></script>
  </body>
</html>
