<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="/fonts/golos/fonts.css" />
    <link rel="stylesheet" href="/brand/legacy-shell.css" />

    <link rel="stylesheet" href="/brand/cabinet.css" />

      body.tt-lk-mode .tt-demo-head-popover,

      #tt-root-host {
        min-width: 0;

        max-width: 1500px;

    <script src="/tan-tracker-lk-shell.js"></script>
