<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Клиенты — tandoor-rf</title>
    <link rel="stylesheet" href="/fonts/golos/fonts.css" />
    <link rel="stylesheet" href="/brand/legacy-shell.css" />
    <link rel="stylesheet" href="/clients.css" />
    <link rel="stylesheet" href="/clients-design.css" />
  </head>
  <body class="legacy-body clients-design-page">
    <div class="legacy-app">
      <div id="workspace-sidebar"></div>
      <button type="button" class="legacy-backdrop" id="legacy-backdrop" hidden aria-label="Закрыть меню"></button>
      <div class="legacy-frame">
        <div id="workspace-topbar"></div>
        <main class="legacy-content">
          <header class="clients-page-header">
            <h1 class="clients-page-title" id="clients-page-title">Клиенты</h1>
            <p id="clients-page-subtitle" class="clients-page-subtitle clients-hidden"></p>
          </header>

          <div id="access-panel" class="clients-hidden" role="alert"></div>
          <div id="init-panel" class="clients-hidden" role="alert"></div>

          <div id="clients-app" class="clients-hidden">
            <nav id="view-switcher" class="clients-view-switcher" aria-label="Режим просмотра">
              <button type="button" class="clients-view-switcher__btn" data-view="all">Все клиенты</button>
              <button type="button" class="clients-view-switcher__btn" data-view="teams">По командам</button>
              <button type="button" class="clients-view-switcher__btn clients-hidden" data-view="review" id="view-review-tab">
                Требуют проверки
              </button>
              <button type="button" class="clients-view-switcher__btn clients-hidden" data-view="completeness" id="view-completeness-tab">
                Незаполненные назначения
              </button>
            </nav>

            <div id="clients-manager-chrome" class="clients-manager-chrome clients-hidden">
              <div class="clients-employee-card" id="clients-employee-card">
                <div class="clients-employee-card__main">
                  <div class="clients-employee-card__avatar" id="clients-employee-avatar" aria-hidden="true"></div>
                  <div>
                    <div class="clients-employee-card__name" id="clients-employee-name"></div>
                    <div class="clients-employee-card__role" id="clients-employee-role"></div>
                  </div>
                </div>
                <div class="clients-employee-card__scope">
                  <span class="clients-employee-card__scope-label">Область видимости</span>
                  <span class="clients-employee-card__scope-value" id="clients-employee-scope-value">Мои назначения</span>
                </div>
              </div>
              <div class="clients-stats-strip" id="clients-stats-strip" aria-label="Сводка по назначениям">
                <div class="clients-stat">
                  <span class="clients-stat__value" id="clients-stat-clients">—</span>
                  <span class="clients-stat__label" id="clients-stat-clients-label">Мои клиенты</span>
                </div>
                <div class="clients-stat">
                  <span class="clients-stat__value" id="clients-stat-outlets">—</span>
                  <span class="clients-stat__label" id="clients-stat-outlets-label">Доступные ТТ</span>
                </div>
                <div class="clients-stat" id="clients-stat-no-outlets-wrap">
                  <span class="clients-stat__value" id="clients-stat-no-outlets">—</span>
                  <span class="clients-stat__label" id="clients-stat-no-outlets-label">Клиенты без ТТ</span>
                </div>
              </div>
              <nav class="clients-workspace-nav" aria-label="Рабочая область">
                <span
                  id="clients-workspace-nav-tab"
                  class="clients-workspace-nav__tab clients-workspace-nav__tab--active"
                  >Моя база</span
                >
              </nav>
            </div>

            <nav id="clients-breadcrumbs" class="clients-breadcrumbs clients-hidden" aria-label="Навигация">
              <div id="clients-breadcrumbs-row" class="clients-breadcrumbs__row"></div>
            </nav>

            <div id="teams-panel" class="clients-teams-panel clients-hidden"></div>
            <div id="unassigned-panel" class="clients-unassigned-panel clients-hidden"></div>

            <div class="clients-toolbar">
              <div class="clients-toolbar__search-row">
                <label class="clients-field clients-field--search">
                  <span class="clients-field__label">Поиск</span>
                  <input
                    id="search-input"
                    class="clients-field__input"
                    type="search"
                    autocomplete="off"
                    placeholder="Название, холдинг, менеджер, адрес или телефон"
                  />
                </label>
                <nav
                  id="entity-switcher"
                  class="clients-view-switcher clients-entity-switcher clients-hidden"
                  aria-label="Тип списка"
                >
                  <button type="button" class="clients-view-switcher__btn" data-entity="clients">Клиенты</button>
                  <button type="button" class="clients-view-switcher__btn" data-entity="outlets">Торговые точки</button>
                </nav>
                <button type="button" class="workspace-button workspace-button--ghost clients-columns-btn" id="columns-picker-btn">
                  Колонки
                </button>
              </div>
              <button
                type="button"
                id="clients-filters-toggle"
                class="clients-filters-toggle"
                aria-expanded="false"
                aria-controls="clients-filters-panel"
              >
                Фильтры
                <span id="clients-filters-active-count" class="clients-filters-toggle__count clients-hidden"></span>
              </button>
              <p id="clients-filters-scope-label" class="clients-filters-scope-label clients-hidden">
                Моя закреплённая область
              </p>
              <div id="clients-filters-panel" class="clients-toolbar__row clients-toolbar__row--filters">
                <div class="clients-field clients-hidden" id="rop-filter-wrap">
                  <span class="clients-field__label" id="rop-filter-label">РОП</span>
                  <div class="clients-combobox" id="rop-combobox">
                    <input
                      id="rop-filter-input"
                      class="clients-field__input clients-combobox__input"
                      type="search"
                      role="combobox"
                      aria-labelledby="rop-filter-label"
                      aria-controls="rop-filter-list"
                      aria-expanded="false"
                      autocomplete="off"
                      placeholder="Все РОП"
                    />
                    <input type="hidden" id="rop-filter" value="" />
                    <ul id="rop-filter-list" class="clients-combobox__list clients-hidden" role="listbox"></ul>
                  </div>
                </div>
                <div class="clients-field" id="manager-filter-wrap">
                  <span class="clients-field__label" id="manager-filter-label">Менеджер 1С</span>
                  <div class="clients-combobox" id="manager-combobox">
                    <input
                      id="manager-filter-input"
                      class="clients-field__input clients-combobox__input"
                      type="search"
                      role="combobox"
                      aria-labelledby="manager-filter-label"
                      aria-controls="manager-filter-list"
                      aria-expanded="false"
                      autocomplete="off"
                      placeholder="Все менеджеры"
                    />
                    <input type="hidden" id="manager-filter" value="" />
                    <ul id="manager-filter-list" class="clients-combobox__list clients-hidden" role="listbox"></ul>
                  </div>
                </div>
                <div class="clients-field" id="holding-filter-wrap">
                  <span class="clients-field__label" id="holding-filter-label">Холдинг</span>
                  <div class="clients-combobox" id="holding-combobox">
                    <input
                      id="holding-filter-input"
                      class="clients-field__input clients-combobox__input"
                      type="search"
                      role="combobox"
                      aria-labelledby="holding-filter-label"
                      aria-controls="holding-filter-list"
                      aria-expanded="false"
                      autocomplete="off"
                      placeholder="Все холдинги"
                    />
                    <input type="hidden" id="holding-filter" value="" />
                    <ul id="holding-filter-list" class="clients-combobox__list clients-hidden" role="listbox"></ul>
                  </div>
                </div>
                <label class="clients-field">
                  <span class="clients-field__label">Телефон</span>
                  <select id="phone-filter" class="clients-field__select">
                    <option value="all">Все</option>
                    <option value="yes">Есть</option>
                    <option value="no">Нет</option>
                  </select>
                </label>
                <label class="clients-field clients-hidden" id="outlets-filter-wrap">
                  <span class="clients-field__label">Торговые точки</span>
                  <select id="outlets-filter" class="clients-field__select">
                    <option value="all">Все</option>
                    <option value="yes">Есть</option>
                    <option value="no">Нет</option>
                  </select>
                </label>
                <label class="clients-field clients-hidden" id="outlet-status-filter-wrap">
                  <span class="clients-field__label">Статус ТТ</span>
                  <select id="outlet-status-filter" class="clients-field__select">
                    <option value="all">Все</option>
                    <option value="open">Открыта</option>
                    <option value="closed">Закрыта</option>
                  </select>
                </label>
                <label class="clients-field clients-hidden" id="warehouse-filter-wrap">
                  <span class="clients-field__label">Склад</span>
                  <select id="warehouse-filter" class="clients-field__select">
                    <option value="all">Все</option>
                    <option value="yes">Да</option>
                    <option value="no">Нет</option>
                    <option value="unknown">Нет данных</option>
                  </select>
                </label>
                <div class="clients-field clients-hidden" id="regional-filter-wrap">
                  <span class="clients-field__label" id="regional-filter-label">Региональный</span>
                  <div class="clients-combobox" id="regional-combobox">
                    <input
                      id="regional-filter-input"
                      class="clients-field__input clients-combobox__input"
                      type="search"
                      role="combobox"
                      aria-labelledby="regional-filter-label"
                      aria-controls="regional-filter-list"
                      aria-expanded="false"
                      autocomplete="off"
                      placeholder="Все региональные"
                    />
                    <input type="hidden" id="regional-filter" value="" />
                    <ul id="regional-filter-list" class="clients-combobox__list clients-hidden" role="listbox"></ul>
                  </div>
                </div>
                <label class="clients-field clients-hidden" id="tandoor-filter-wrap">
                  <span class="clients-field__label">Tandoor Club</span>
                  <input id="tandoor-filter" class="clients-field__input" type="search" autocomplete="off" placeholder="Статус клуба" />
                </label>
                <label class="clients-field clients-hidden" id="review-state-filter-wrap">
                  <span class="clients-field__label">Состояние ревизии</span>
                  <select id="review-state-filter" class="clients-field__select">
                    <option value="">Все</option>
                  </select>
                </label>
                <label class="clients-field clients-hidden" id="review-decision-filter-wrap">
                  <span class="clients-field__label">Решение ревизии</span>
                  <select id="review-decision-filter" class="clients-field__select">
                    <option value="">Все</option>
                  </select>
                </label>
                <label class="clients-field clients-hidden" id="unassigned-filter-wrap">
                  <span class="clients-field__label">Нераспределённое</span>
                  <select id="unassigned-filter" class="clients-field__select">
                    <option value="">Все категории</option>
                  </select>
                </label>
                <label class="clients-field clients-hidden" id="completeness-reason-filter-wrap">
                  <span class="clients-field__label">Причина неполноты</span>
                  <select id="completeness-reason-filter" class="clients-field__select" multiple size="1">
                    <option value="missing_rop">Не указан РОП</option>
                    <option value="missing_manager">Не указан менеджер</option>
                    <option value="missing_regional">Не указан региональный</option>
                    <option value="responsible_outside_roster">Вне справочника ОПТ</option>
                    <option value="invalid_or_conflicting_assignment">Некорректное назначение</option>
                    <option value="org_role_conflict">Конфликт орг. роли</option>
                    <option value="field_not_provided">Поле не передано</option>
                    <option value="data_stale">Данные устарели</option>
                    <option value="roster_unavailable">Справочник ОПТ недоступен</option>
                  </select>
                </label>
                <button id="reset-filters" type="button" class="workspace-button workspace-button--ghost">
                  Сбросить
                </button>
              </div>
            </div>

            <div class="clients-results-shell">
              <div class="clients-results-shell__head">
                <div class="clients-results-shell__title-row">
                  <h2 class="clients-results-shell__title clients-hidden" id="clients-results-title">Мои клиенты</h2>
                  <p id="result-count" class="clients-results-shell__count">Найдено 0 клиентов</p>
                </div>
                <p id="sync-status" class="clients-sync"></p>
              </div>
              <div id="columns-picker" class="clients-columns-picker clients-hidden" role="dialog" aria-label="Выбор колонок"></div>
              <div id="results-panel">
              <div id="results-state" class="clients-hidden" role="status" aria-live="polite"></div>
              <div id="results-content">
                <div class="clients-table-wrap">
                  <table class="clients-table" aria-label="Список клиентов">
                    <thead>
                      <tr id="clients-table-head-row">
                        <th scope="col">Клиент</th>
                        <th scope="col">Холдинг</th>
                        <th scope="col">Менеджер</th>
                        <th scope="col" data-col="team" class="clients-hidden">Команда</th>
                        <th scope="col" data-col="review" class="clients-hidden">Ревизия</th>
                        <th scope="col">Адрес</th>
                        <th scope="col">Телефон</th>
                      </tr>
                    </thead>
                    <tbody id="clients-table-body"></tbody>
                  </table>
                </div>
                <div id="clients-cards" class="clients-cards"></div>
              </div>
              <nav id="pagination" class="clients-pagination" aria-label="Пагинация"></nav>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="/common.js" defer></script>
    <script src="/clients-logic.js" defer></script>
    <script src="/brand/shell-icons.js" defer></script>
    <script src="/clients-shell.js" defer></script>
    <script src="/clients.js" defer></script>
  </body>
</html>
