<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/brand/theme-init.js"></script>
    <title>Смена пароля | Тандор</title>
    <link rel="stylesheet" href="/fonts/exo-2/fonts.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/brand/cabinet.css" />
  </head>
  <body class="auth-body">
    <main class="page page--form">
      <div class="auth-brand">
        <img
          class="auth-brand__logo"
          data-legacy-logo
          src="/brand/tandoor-logo-official.svg"
          width="149"
          height="42"
          alt="Tandoor"
        />
      </div>
      <h1 class="title">Смена временного пароля</h1>
      <p class="subtitle">
        Перед работой в ЛК задайте новый пароль. Текущая сессия сохранится; остальные будут завершены.
      </p>

      <form id="change-password-form" class="form" novalidate>
        <div class="field">
          <label class="field__label" for="current-password">Текущий пароль</label>
          <div class="password-row">
          <input
            id="current-password"
            name="currentPassword"
            type="password"
            autocomplete="current-password"
            required
            class="field__input"
          />
          <button type="button" class="secondary-button" data-password-toggle="current-password"
            data-password-label="текущий пароль" aria-controls="current-password"
            aria-label="Показать текущий пароль" aria-pressed="false">Показать</button>
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="new-password">Новый пароль</label>
          <div class="password-row">
          <input
            id="new-password"
            name="newPassword"
            type="password"
            autocomplete="new-password"
            required
            minlength="12"
            class="field__input"
          />
          <button type="button" class="secondary-button" data-password-toggle="new-password"
            data-password-label="новый пароль" aria-controls="new-password"
            aria-label="Показать новый пароль" aria-pressed="false">Показать</button>
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="confirm-password">Повтор нового пароля</label>
          <div class="password-row">
          <input
            id="confirm-password"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            required
            minlength="12"
            class="field__input"
          />
          <button type="button" class="secondary-button" data-password-toggle="confirm-password"
            data-password-label="повтор нового пароля" aria-controls="confirm-password"
            aria-label="Показать повтор нового пароля" aria-pressed="false">Показать</button>
          </div>
        </div>

        <button id="change-password-button" type="submit" class="primary-button">
          Сохранить пароль
        </button>
      </form>

      <p id="status-message" class="status" role="status" aria-live="polite"></p>
      <p class="theme-row"><button type="button" class="secondary-button" data-theme-toggle>Тёмная тема</button></p>
    </main>

    <script src="/common.js"></script>
    <script src="/brand/shell-icons.js"></script>
    <script src="/clients-shell.js"></script>
    <script src="/change-password.js"></script>
  </body>
</html>
