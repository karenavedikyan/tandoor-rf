<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Смена пароля — tandoor-rf</title>
    <link rel="stylesheet" href="/fonts/exo-2/fonts.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth-body">
    <main class="page page--form">
      <div class="auth-brand">
        <img
          class="auth-brand__logo"
          data-legacy-logo
          src="/brand/tandoor-logo-official.svg"
          width="149"
          height="42"
          alt="Tandoor"
        />
        <p class="subtitle">tandoor-rf</p>
      </div>
      <h1 class="title">Смена временного пароля</h1>
      <p class="subtitle">
        Перед работой в ЛК задайте новый пароль. Текущая сессия сохранится; остальные будут завершены.
      </p>

      <form id="change-password-form" class="form" novalidate>
        <label class="field">
          <span class="field__label">Текущий пароль</span>
          <input
            id="current-password"
            name="currentPassword"
            type="password"
            autocomplete="current-password"
            required
            class="field__input"
          />
        </label>

        <label class="field">
          <span class="field__label">Новый пароль</span>
          <input
            id="new-password"
            name="newPassword"
            type="password"
            autocomplete="new-password"
            required
            minlength="12"
            class="field__input"
          />
        </label>

        <label class="field">
          <span class="field__label">Повтор нового пароля</span>
          <input
            id="confirm-password"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            required
            minlength="12"
            class="field__input"
          />
        </label>

        <button id="change-password-button" type="submit" class="button button--primary">
          Сохранить пароль
        </button>
      </form>

      <p id="status-message" class="status" role="status" aria-live="polite"></p>
    </main>

    <script src="/common.js"></script>
    <script src="/change-password.js"></script>
  </body>
</html>
